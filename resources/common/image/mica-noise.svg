<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160">
  <!-- 云母（Mica）材质的**颗粒噪点**：极淡的中性灰噪点，平铺在攻略区背景上。
       opacity 压得很低（.09）—— 只做质感；卡片是近实色、噪点只在卡片**周围**的底上，
       所以任何文字都不会被噪声干扰。 -->
  <filter id="micaNoise">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="160" height="160" filter="url(#micaNoise)" opacity="0.09"/>
</svg>

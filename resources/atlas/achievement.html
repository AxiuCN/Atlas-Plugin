<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <link rel="stylesheet" type="text/css" href="{{_res_path}}/common/base.css"/>
  <link rel="stylesheet" type="text/css" href="{{_res_path}}/common/components.css"/>
  <link rel="stylesheet" type="text/css" href="{{_res_path}}/common/hero.css"/>
  <link rel="stylesheet" type="text/css" href="{{_res_path}}/common/achievement.css"/>
</head>
<body style="zoom:{{renderScale}}">
  <div class="hero">
    {{if versionBadge}}
    <div class="hero-version">
      <div class="hero-version-line">{{versionBadge.label}}</div>
      <div class="hero-version-line hero-version-short">{{versionBadge.short}}</div>
    </div>
    {{/if}}
    <div class="hero-text">
      <div class="hero-game">{{gameName}} · {{keyword}}</div>
      <div class="hero-title">成就分类</div>
      {{if total}}
      <div class="hero-subtitle">共 {{total}} 条成就，{{groups.length}} 个分类</div>
      {{/if}}
    </div>
  </div>

  <div class="achievement-grid">
    {{each groups group}}
    <div class="achievement-card">
      <div class="ac-name">{{group.title}}</div>
      <div class="ac-count">{{group.items.length}} 条</div>
    </div>
    {{/each}}
  </div>

  <div class="hint">成就数据来自 nanoka.cc</div>
  <div class="copyright">
  <div>Data from {{credit}}</div>
  <div>{{@copyright}}</div>
</div>
</body>
</html>

# Atlas-Plugin 配置模板
# 优先级：数字越小越先执行（建议不低于10000，避免干扰 miao-plugin 等）
priority: ${atlas_priority}

# 渲染缩放比例
renderScale: ${atlas_renderScale}

# ---------- 通知 ----------
# 更新完成后通知的群号列表（逗号分隔），留空仅通知主人
notifyGroups: "${atlas_notifyGroups}"

# 通知模式：all = 主人+配置群 / master_only = 仅主人
notifyMode: ${atlas_notifyMode}

# ---------- 自动更新 ----------
autoUpdate:
  # 是否启用每日自动抓取更新
  enabled: ${atlas_autoUpdate_enabled}
  # 自动更新 cron 表达式（6字段：秒 分 时 日 月 周）
  cron: "${atlas_autoUpdate_cron}"
  # 增量抓取失败后的重试次数
  retries: ${atlas_autoUpdate_retries}
  # 重试前的等待毫秒数
  retryDelayMs: ${atlas_autoUpdate_retryDelayMs}
  # 增量抓取多次失败后是否降级全量抓取
  fallbackToFull: ${atlas_autoUpdate_fallbackToFull}
  # 单次抓取超时毫秒数（默认 7200000 = 2 小时）
  timeoutMs: ${atlas_autoUpdate_timeoutMs}

# ---------- 别名管理 ----------
# #图鉴别名设置/删除 的权限（master=仅主人 / group_admin=群主或管理员 / all=所有人）
alias:
  set: ${atlas_alias_set}
  del: ${atlas_alias_del}
  # 列表查看默认为 all（只读，不涉敏感）
  list: ${atlas_alias_list}
